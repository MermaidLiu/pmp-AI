# 复制到服务器 /etc/nginx/sites-available/lingxi 后按需改域名与路径，再 ln -s 到 sites-enabled
# 假设：前端静态资源在 /var/www/lingxi/dist，后端监听 127.0.0.1:8000

server {
    listen 80;
    server_name _;   # 改成你的域名，例如 petct.example.com

    root /var/www/lingxi/dist;
    index index.html;

    客户端上传体积与长耗时影像分析：

    client_max_body_size 200m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /schema/ {
        proxy_pass http://127.0.0.1:8000/schema/;
        proxy_set_header Host $host;
    }
}
